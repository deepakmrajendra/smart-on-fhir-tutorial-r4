<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deepakmrajendra Example-SMART-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .hidden { display: none; }
      #loading { text-align: center; padding: 2em; }
      .error { color: red; padding: 1em; }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <div id="loading">Loading patient data...</div>
      <div id="errors" class="error hidden"></div>
      <div id="patient-data" class="hidden">
        <h2>Patient Information</h2>
        <div class="card mb-4">
          <div class="card-body">
            <h3 class="card-title">Demographics</h3>
            <p>Name: <span id="name"></span></p>
            <p>Gender: <span id="gender"></span></p>
            <p>Date of Birth: <span id="dob"></span></p>
          </div>
        </div>

        <h3>Observations</h3>
        <div class="row">
          <div class="col-md-6">
            <div class="card mb-3">
              <div class="card-body">
                <h4>Vital Signs</h4>
                <p>Height: <span id="height"></span></p>
                <p>Weight: <span id="weight"></span></p>
                <p>BMI: <span id="bmi"></span></p>
                <p>Blood Pressure: <span id="bp"></span></p>
                <p>Heart Rate: <span id="heartrate"></span></p>
                <p>Temperature: <span id="temperature"></span></p>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card mb-3">
              <div class="card-body">
                <h4>Lab Results</h4>
                <p>Glucose: <span id="glucose"></span></p>
                <p>HDL: <span id="hdl"></span></p>
                <p>LDL: <span id="ldl"></span></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FHIR Client -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
      // LOINC code mapping
      const CODES = {
        height: '8302-2',
        diastolicBP: '8462-4',
        systolicBP: '8480-6',
        hdl: '2085-9',
        ldl: '2089-1',
        bp: '55284-4',
        weight: '29463-7',
        bmi: '39156-5',
        temperature: '8310-5',
        heartRate: '8867-4',
        glucose: '2339-0'
      };

      // Modern async FHIR client initialization
      async function init() {
        try {
          // Initialize SMART client
          const smart = await FHIR.oauth2.ready();

          console.log('Access token:', smart.state.tokenResponse.access_token);
          console.log('Scopes:', smart.state.tokenResponse.scope);
          console.log('Patient ID:', smart.patient.id);
          console.log('Patient Name:', smart.patient.name);
          console.log('Patient Gender:', smart.patient.gender);
          console.log('Patient Birth Date:', smart.patient.birthDate);
          
          // Get patient context
          const patient = await smart.patient.read();
          console.log('Fetched patient:', patient);
          
          // const patientId = smart.patient.id;
          // const patient = await smart.request(`Patient/${patientId}`);

          // Build observation query
          const query = new URLSearchParams();
          query.set('patient', smart.patient.id);
          // query.set('patient', patientId);
          query.set('code', Object.values(CODES).join(','));
          
          // Fetch observations with proper error handling
          const observations = await smart.request(`Observation?${query}`);
          
          if (!observations || !observations.entry) {
            throw new Error('No observations found');
          }

          // Display data
          displayPatient(patient);
          displayObservations(observations);

          // Show content
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('patient-data').classList.remove('hidden');
          
        } catch (error) {
          console.error('Error:', error);
          const errorDiv = document.getElementById('errors');
          errorDiv.classList.remove('hidden');
          errorDiv.textContent = `Error: ${error.message}`;
          document.getElementById('loading').classList.add('hidden');
        }
      }

      function displayPatient(patient) {
        const name = patient.name?.[0];
        const nameText = name ? `${name.given?.join(' ') || ''} ${name.family || ''}`.trim() : 'Unknown';

        document.getElementById('name').textContent = nameText;
        document.getElementById('gender').textContent = patient.gender || 'Unknown';
        document.getElementById('dob').textContent = patient.birthDate || 'Unknown';
      }

      function displayObservations(observations) {
        const getObservationByCode = (code) => {
          return observations.entry?.find(entry => 
            entry.resource?.code?.coding?.some(coding => coding.code === code)
          )?.resource;
        };

        const getQuantityDisplay = (observation) => {
          if (!observation?.valueQuantity) return 'Not available';
          const { value, unit } = observation.valueQuantity;
          return `${value} ${unit || ''}`.trim();
        };

        // Display vital signs
        document.getElementById('height').textContent = getQuantityDisplay(getObservationByCode(CODES.height));
        document.getElementById('weight').textContent = getQuantityDisplay(getObservationByCode(CODES.weight));
        document.getElementById('bmi').textContent = getQuantityDisplay(getObservationByCode(CODES.bmi));
        document.getElementById('temperature').textContent = getQuantityDisplay(getObservationByCode(CODES.temperature));
        document.getElementById('heartrate').textContent = getQuantityDisplay(getObservationByCode(CODES.heartRate));

        // Handle blood pressure (systolic/diastolic)
        const bp = getObservationByCode(CODES.bp);
        if (bp?.component) {
          const systolic = bp.component.find(c =>
            c.code?.coding?.some(coding => coding.code === CODES.systolicBP)
          )?.valueQuantity;

          const diastolic = bp.component.find(c =>
            c.code?.coding?.some(coding => coding.code === CODES.diastolicBP)
          )?.valueQuantity;

          document.getElementById('bp').textContent = systolic && diastolic ?
            `${systolic.value}/${diastolic.value} ${systolic.unit || ''}`.trim() : 'Not available';
        } else {
          document.getElementById('bp').textContent = 'Not available';
        }

        // Display lab results
        document.getElementById('glucose').textContent = getQuantityDisplay(getObservationByCode(CODES.glucose));
        document.getElementById('hdl').textContent = getQuantityDisplay(getObservationByCode(CODES.hdl));
        document.getElementById('ldl').textContent = getQuantityDisplay(getObservationByCode(CODES.ldl));
      }

      // Initialize the application
      init();
    </script>
  </body>
</html>
