<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>deepakmrajendra Example-SMART-App</title>
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
  </head>
  <body>
    <div id='errors'></div>
    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id='holder' >
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last Name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table>
      <h2>Observation Resource</h2>
      <table>
        <tr>
          <th>Height:</th>
          <td id='height'></td>
        </tr>
        <tr>
          <th>Weight:</th>
          <td id='weight'></td>
        </tr>
        <tr>
          <th>BMI:</th>
          <td id='bmi'></td>
        </tr>
        <tr>
          <th>Temperature:</th>
          <td id='temperature'></td>
        </tr>
        <tr>
          <th>Heart Rate:</th>
          <td id='heartrate'></td>
        </tr>
        <tr>
          <th>Blood Glucose:</th>
          <td id='glucose'></td>
        </tr>
        <tr>
          <th>Systolic Blood Pressure:</th>
          <td id='systolicbp'></td>
        </tr>
        <tr>
          <th>Diastolic Blood Pressure:</th>
          <td id='diastolicbp'></td>
        </tr>
        <tr>
          <th>LDL:</th>
          <td id='ldl'></td>
        </tr>
        <tr>
          <th>HDL:</th>
          <td id='hdl'></td>
        </tr>
      </table>
    </div>

    <!-- Application-level javascript-->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.0/build/fhir-client.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src='./src/js/example-smart-app.js'></script>
    <script>
      window.onload = function() {
        if (window.FHIR) {
          extractData().then(
            function(p) {
              drawVisualization(p);
            },
            function(error) {
              $('#loading').hide();
              $('#errors').html('<p>Failed to call FHIR Service: ' + error.message + '</p>');
            }
          );
        } else {
          $('#loading').hide();
          $('#errors').html('<p>Error: FHIR client failed to load</p>');
        }
      };
    </script>
  </body>
</html>
