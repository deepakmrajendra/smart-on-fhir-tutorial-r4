<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART on FHIR Launch</title>
    <!-- Modern FHIR Client -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <script>
      // Modern SMART on FHIR launch sequence
      const smartConfig = {
        // You'll need to replace this with the new client ID after re-registration
        clientId: '2ada2c94-6f04-44ff-8057-a1ed359a5b66',
        // Scopes matching the new registration exactly
        scope: 'launch profile fhirUser openid online_access patient/Patient.read patient/Patient.search patient/Observation.read patient/Observation.search',
        redirectUri: 'https://deepakmrajendra.github.io/smart-on-fhir-tutorial-r4/example-smart-app/'
      };

      // Initialize SMART
      FHIR.oauth2.authorize(smartConfig).catch(error => {
        console.error('Authorization Error:', error);
        document.getElementById('loading').innerHTML = `Error: ${error.message}`;
      });
    </script>
  </body>
</html>
