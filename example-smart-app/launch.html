<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <title>Example-SMART-App</title>
  </head>
  <body>

    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>

    <!-- FHIR Client from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.0/build/fhir-client.min.js"></script>
    <script>
      // Wait for the FHIR client to be loaded
      window.onload = function() {
        if (window.FHIR) {
          FHIR.oauth2.authorize({
            'client_id': '6cdc1adf-05e9-4179-bbff-cb9eeb163a9a',
            'scope': 'patient/Patient.read patient/Observation.read launch online_access openid profile',
            'redirectUri': 'index.html',
            'completeInTarget': true
          });
        } else {
          console.error('FHIR client not loaded');
          document.body.innerHTML += '<p style="color: red;">Error: FHIR client failed to load</p>';
        }
      };
    </script>
  </body>
</html>
