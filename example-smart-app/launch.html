<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART on FHIR Launch</title>
    <!-- Modern FHIR Client -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <script>
      // Modern SMART on FHIR launch sequence
      const smartConfig = {
        clientId: '6cdc1adf-05e9-4179-bbff-cb9eeb163a9a',
        // Explicit scopes as required by Cerner R4
        scope: 'launch online_access openid profile patient/Patient.read patient/Observation.read',
        // Exact match with Cerner registration - no index.html
        redirectUri: 'https://deepakmrajendra.github.io/smart-on-fhir-tutorial-r4/example-smart-app/'
      };

      // Initialize SMART
      FHIR.oauth2.authorize(smartConfig).catch(error => {
        console.error('Authorization Error:', error);
        document.getElementById('loading').innerHTML = `Error: ${error.message}`;
      });
    </script>
  </body>
</html>
