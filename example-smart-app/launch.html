<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART on FHIR Launch</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <script>
      const clientId = '9f803871-8fb9-4363-a802-d6d00a0dc2e8';
      const redirectUri = 'https://deepakmrajendra.github.io/smart-on-fhir-tutorial-r4/example-smart-app/';

      const queryParams = new URLSearchParams(window.location.search);
      const launch = queryParams.get('launch');
      const iss = queryParams.get('iss');

      if (!launch || !iss) {
        document.getElementById('loading').innerText = 'Error: Missing launch or iss parameter';
      } else {
        FHIR.oauth2.authorize({
          clientId,
          redirectUri,
          scope: 'launch openid profile patient/Patient.read patient/Observation.read online_access',
          iss,
          launch,
          completeInTarget: true
        });
      }
    </script>
  </body>
</html>
