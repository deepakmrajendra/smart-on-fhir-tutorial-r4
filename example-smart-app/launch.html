<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART on FHIR Launch</title>
    <!-- Modern FHIR Client -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <script>
      // Get launch context from URL
      const queryParams = new URLSearchParams(window.location.search);
      const launchParam = queryParams.get('launch');
      const issParam = queryParams.get('iss');

      if (!launchParam || !issParam) {
        document.getElementById('loading').innerHTML = 'Error: Missing launch context or iss parameter';
      } else {
        // Use minimal required scopes for R4
        FHIR.oauth2.authorize({
          clientId: '9f803871-8fb9-4363-a802-d6d00a0dc2e8',
          // Minimal required scopes for R4
          scope: 'launch openid fhirUser patient/Patient.rs patient/Observation.rs',
          redirectUri: 'https://deepakmrajendra.github.io/smart-on-fhir-tutorial-r4/example-smart-app/',
          launch: launchParam,
          iss: issParam,
          completeInTarget: true
        }).catch(error => {
          console.error('Authorization Error:', error);
          document.getElementById('loading').innerHTML = `Error: ${error.message}`;
        });
      }
    </script>
  </body>
</html>
